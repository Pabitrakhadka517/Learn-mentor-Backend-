<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
</head>
<body>
    <h1>Backend API Test</h1>
    <div>
        <h2>Test Health Endpoint</h2>
        <button onclick="testHealth()">Test /health</button>
        <div id="healthResult"></div>
    </div>
    
    <div>
        <h2>Test Registration</h2>
        <button onclick="testRegister()">Test /api/auth/register</button>
        <div id="registerResult"></div>
    </div>
    
    <div>
        <h2>Test Login</h2>
        <button onclick="testLogin()">Test /api/auth/login</button>
        <div id="loginResult"></div>
    </div>

    <script>
        async function testHealth() {
            const result = document.getElementById('healthResult');
            try {
                const response = await fetch('http://localhost:4000/health');
                const data = await response.json();
                result.innerHTML = `<p style="color: green;">✅ Success: ${JSON.stringify(data)}</p>`;
            } catch (error) {
                result.innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
            }
        }

        async function testRegister() {
            const result = document.getElementById('registerResult');
            const testData = {
                email: `test${Math.random()}@example.com`,
                password: 'TestPassword123!',
                fullName: 'Test User',
                role: 'STUDENT'
            };
            
            try {
                const response = await fetch('http://localhost:4000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });
                
                const data = await response.json();
                if (response.ok) {
                    result.innerHTML = `<p style="color: green;">✅ Registration Success: ${JSON.stringify(data)}</p>`;
                } else {
                    result.innerHTML = `<p style="color: orange;">⚠️ Registration Response: ${JSON.stringify(data)}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p style="color: red;">❌ Registration Error: ${error.message}</p>`;
            }
        }

        async function testLogin() {
            const result = document.getElementById('loginResult');
            const testData = {
                email: 'newtest@example.com', // Use the email we created earlier
                password: 'TestPassword123!'
            };
            
            try {
                const response = await fetch('http://localhost:4000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });
                
                const data = await response.json();
                if (response.ok) {
                    result.innerHTML = `<p style="color: green;">✅ Login Success: ${JSON.stringify(data)}</p>`;
                } else {
                    result.innerHTML = `<p style="color: orange;">⚠️ Login Response: ${JSON.stringify(data)}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p style="color: red;">❌ Login Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
